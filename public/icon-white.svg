<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#FFFFFF" />
  <g transform="translate(56, 56) scale(0.78)">
    
  <defs>
    <!-- Metallic Gold Gradients -->
    <radialGradient id="coinGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fae4a8" />
      <stop offset="35%" stop-color="#dfba6c" />
      <stop offset="70%" stop-color="#b88a38" />
      <stop offset="100%" stop-color="#73521a" />
    </radialGradient>
    <radialGradient id="innerRimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#694814" />
      <stop offset="88%" stop-color="#e8c77b" />
      <stop offset="100%" stop-color="#8a6120" />
    </radialGradient>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c275" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c6953f" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#8a5f1e" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="monogramGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff0c4" />
      <stop offset="40%" stop-color="#dfb967" />
      <stop offset="75%" stop-color="#8a5e19" />
      <stop offset="100%" stop-color="#54370a" />
    </linearGradient>
    <filter id="emboss" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#3d2605" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Golden Wireframe Spiral Loops (Signature CBE Vortex) -->
  <g fill="none" stroke="url(#wireGrad)" stroke-width="3" opacity="0.85">
    <path d="M 250,250 C 320,160 410,120 420,180 C 430,240 370,330 250,370 C 130,410 70,360 80,280 C 90,200 160,110 270,90 C 370,70 450,130 460,220 C 470,310 390,410 270,440 C 140,470 50,390 40,290 C 30,170 120,60 250,40 C 370,20 480,90 485,220 C 490,340 400,460 250,480" />
    <path d="M 250,250 C 340,180 430,150 435,210 C 440,270 370,360 250,390 C 120,420 50,340 60,250 C 70,160 160,70 280,60 C 400,50 470,140 470,240 C 470,340 380,430 250,455" stroke-width="2.5" opacity="0.7" />
    <path d="M 250,250 C 360,200 450,180 445,240 C 440,300 360,380 250,410 C 130,435 40,330 50,220 C 60,120 170,50 300,50" stroke-width="2" opacity="0.6" />
    <path d="M 220,250 C 290,140 370,90 400,140 C 430,190 380,290 270,340 C 160,390 100,340 100,270 C 100,200 160,120 260,90" stroke-width="2.5" opacity="0.65" />
    <!-- Loops flaring to top-right -->
    <path d="M 270,220 C 330,130 380,80 395,90 C 415,105 385,175 315,245" stroke-width="3" />
    <path d="M 285,230 C 350,140 405,85 425,100 C 445,120 405,195 330,265" stroke-width="2.5" />
    <path d="M 300,240 C 370,150 430,90 455,115 C 475,140 425,215 345,285" stroke-width="2" />
  </g>

  <!-- Central CBE Medallion Coin -->
  <!-- Fluted / Serrated Outer Edge of Coin -->
  <g filter="url(#emboss)">
    <circle cx="250" cy="250" r="148" fill="#5c3f10" />
    <circle cx="250" cy="250" r="144" fill="url(#coinGrad)" />
    <!-- Milled gear rim ridges -->
    <circle cx="250" cy="250" r="140" fill="none" stroke="#7a5518" stroke-width="3" stroke-dasharray="4 3" />
    <!-- Inner Coin Field -->
    <circle cx="250" cy="250" r="134" fill="url(#coinGrad)" stroke="#fae4a8" stroke-width="1.5" />
    <circle cx="250" cy="250" r="124" fill="url(#innerRimGrad)" />
    <circle cx="250" cy="250" r="120" fill="url(#coinGrad)" />
  </g>

  <!-- Amharic Circular Text Around Coin: የኢትዮጵያ ንግድ ባንክ -->
  <defs>
    <path id="textArcTop" d="M 148,250 A 102,102 0 0,1 352,250" fill="none" />
    <path id="textArcBottom" d="M 352,250 A 102,102 0 0,1 148,250" fill="none" />
  </defs>

  <g fill="#422906" font-family="'Roboto', 'Noto Sans Ethiopic', sans-serif" font-weight="900" font-size="22" letter-spacing="4" filter="url(#emboss)">
    <text dy="-4">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
        የኢትዮጵያ
      </textPath>
    </text>
    <text dy="20">
      <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
        ንግድ ባንክ
      </textPath>
    </text>
  </g>

  <!-- CBE Center Monogram ("C", "B", "E") -->
  <g filter="url(#emboss)">
    <!-- Outer stylized 'C' embracing B and E -->
    <path d="M 285,178 C 210,174 186,206 186,250 C 186,294 210,326 285,322 L 285,302 C 235,304 214,284 214,250 C 214,216 235,196 285,198 Z" fill="url(#monogramGrad)" stroke="#523508" stroke-width="1.5" />

    <!-- Letter 'B' & 'E' Combined Monogram -->
    <!-- Vertical stem -->
    <rect x="230" y="196" width="16" height="108" fill="url(#monogramGrad)" stroke="#523508" stroke-width="1.2" />

    <!-- 'B' Top loop -->
    <path d="M 246,196 C 285,196 285,248 246,248 Z" fill="url(#monogramGrad)" stroke="#523508" stroke-width="1.2" />
    <path d="M 246,208 C 267,208 267,236 246,236 Z" fill="#b38634" />

    <!-- 'B' Bottom loop -->
    <path d="M 246,248 C 288,248 288,304 246,304 Z" fill="url(#monogramGrad)" stroke="#523508" stroke-width="1.2" />
    <path d="M 246,260 C 270,260 270,292 246,292 Z" fill="#b38634" />

    <!-- 'E' horizontal arms extended -->
    <rect x="246" y="196" width="46" height="11" fill="url(#monogramGrad)" stroke="#523508" stroke-width="1" />
    <rect x="246" y="244" width="38" height="10" fill="url(#monogramGrad)" stroke="#523508" stroke-width="1" />
    <rect x="246" y="293" width="46" height="11" fill="url(#monogramGrad)" stroke="#523508" stroke-width="1" />
  </g>


  </g>
</svg>