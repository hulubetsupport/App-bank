name: CBE Mobile Banking CI/CD Pipeline - Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Type Checking & Lint
        run: npm run lint

      - name: Run Unit Tests (Pure Logic Verification)
        run: npx tsx --test src/**/*.test.ts

  build-android-apk:
    name: Build & Package Android Debug APK
    needs: test
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "Using Android SDK at: $ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify & Prepare APK for Download
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/cbe-mobile-banking-v1.0.0-debug.apk
          echo "Debug APK built successfully:"
          ls -lh build-output/cbe-mobile-banking-v1.0.0-debug.apk

      - name: Upload Installable Android APK (Downloadable from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: cbe-mobile-banking-debug-apk
          path: build-output/cbe-mobile-banking-v1.0.0-debug.apk
          retention-days: 30

      - name: Package Web Distribution Bundle
        run: |
          mkdir -p distribution
          cp -r dist/* distribution/
          zip -r cbe-mobile-banking-web-dist.zip distribution/

      - name: Upload Web PWA Distribution
        uses: actions/upload-artifact@v4
        with:
          name: cbe-mobile-banking-web-package
          path: cbe-mobile-banking-web-dist.zip
          retention-days: 14
